# Gateway do ControleEstoque: roteia /api/<contexto>/ para a API interna do contexto.
# Origens Capacitor (iOS/Android) precisam de CORS; o front web servido pelo próprio
# gateway usa a mesma origem e não depende destes headers.
map $http_origin $cors_origin {
    default                 "";
    "capacitor://localhost" $http_origin;
    "https://localhost"     $http_origin;
    "http://localhost"      $http_origin;
    "http://localhost:4200" $http_origin;
}

server {
    listen 8080;

    # foto de produto: multipart até 5MB + overhead
    client_max_body_size 10m;

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, X-Correlation-Id, Authorization" always;
    add_header Access-Control-Expose-Headers "X-Correlation-Id" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/vendas/ {
        proxy_pass http://vendas-api:8080/;
    }

    location /api/clientes/ {
        proxy_pass http://clientes-api:8080/;
    }

    location /api/estoque/ {
        proxy_pass http://estoque-api:8080/;
    }

    location /api/financeiro/ {
        proxy_pass http://financeiro-api:8080/;
    }

    location /api/rh/ {
        proxy_pass http://rh-api:8080/;
    }

    location = /health {
        return 200 "Healthy";
    }

    # Front-end Angular (SPA): estáticos com fallback para index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
