# Gateway do ControleEstoque: roteia /api/<contexto>/ para a API interna do contexto.
# Origens Capacitor (iOS/Android) precisam de CORS; o front web servido pelo próprio
# gateway usa a mesma origem e não depende destes headers.
map $http_origin $cors_origin {
    default                 "";
    "capacitor://localhost" $http_origin;
    "https://localhost"     $http_origin;
    "http://localhost"      $http_origin;
    "http://localhost:4200" $http_origin;
}

# Cache por rota: index.html sempre revalidado, assets com hash imutáveis.
map $uri $cache_control {
    default                                          "";
    /                                                "no-cache";
    /index.html                                      "no-cache";
    "~/[^/]*-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$"  "public, max-age=31536000, immutable";
}

gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

server {
    listen 8080;
    server_tokens off;

    # foto de produto: multipart até 5MB + overhead
    client_max_body_size 10m;

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, X-Correlation-Id, Authorization" always;
    add_header Access-Control-Expose-Headers "X-Correlation-Id" always;
    add_header Vary Origin always;

    # Regra: nenhum location pode ter add_header próprio (apagaria os herdados do server).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header Cache-Control $cache_control always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /api/vendas/ {
        proxy_pass http://vendas-api:8080/;
    }

    location /api/clientes/ {
        proxy_pass http://clientes-api:8080/;
    }

    location /api/estoque/ {
        proxy_pass http://estoque-api:8080/;
    }

    location /api/financeiro/ {
        proxy_pass http://financeiro-api:8080/;
    }

    location /api/rh/ {
        proxy_pass http://rh-api:8080/;
    }

    # prefixo /api/ desconhecido não pode cair no fallback do SPA
    location /api/ {
        return 404;
    }

    location = /health {
        default_type text/plain;
        return 200 "Healthy";
    }

    # Manifest do PWA: a imagem base não mapeia .webmanifest (cairia em octet-stream).
    # `types { }` só aqui: em server/location / zeraria o mapa herdado (JS/CSS).
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        types { }
        default_type application/manifest+json;
    }

    # Front-end Angular (SPA): estáticos com fallback para index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
